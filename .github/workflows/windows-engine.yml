name: Windows engine build and CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-build-and-cpu-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore MonoGame content-builder tool
        run: dotnet tool restore
      - name: Restore solution
        id: restore
        run: dotnet restore Ember.sln --nologo -p:AutoRestoreMGCBTool=false
      - name: Run CPU test suite
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'EmberEngineTestResults'
          New-Item -ItemType Directory -Path $resultsDirectory -Force | Out-Null
          dotnet test Ember.sln --configuration Release --no-restore --nologo `
            -p:AutoRestoreMGCBTool=false `
            --logger 'console;verbosity=normal' `
            --logger 'trx;LogFileName=cpu-tests.trx' `
            --results-directory $resultsDirectory
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $trxFiles = Get-ChildItem -LiteralPath $resultsDirectory -Filter '*.trx' -File -Recurse
            if ($trxFiles.Count -eq 0) {
              Write-Output '::error title=CPU tests failed::No TRX result file was produced.'
            }
            foreach ($trxFile in $trxFiles) {
              [xml]$trx = Get-Content -LiteralPath $trxFile.FullName -Raw
              foreach ($result in $trx.GetElementsByTagName('UnitTestResult')) {
                if ($result.GetAttribute('outcome') -ne 'Failed') { continue }
                $name = $result.GetAttribute('testName')
                $errorInfo = $result.SelectSingleNode("*[local-name()='Output']/*[local-name()='ErrorInfo']")
                $details = if ($errorInfo) { $errorInfo.InnerText } else { 'No failure details were written to the TRX file.' }
                $message = "$name`: $details" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Output "::error title=CPU test failed::$message"
              }
            }
            exit $testExitCode
          }
      - name: Build solution
        if: always() && steps.restore.outcome == 'success'
        run: dotnet build Ember.sln --configuration Release --no-restore --nologo -p:AutoRestoreMGCBTool=false
